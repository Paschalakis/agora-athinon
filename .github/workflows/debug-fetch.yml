name: Διάγνωση πηγών (προσωρινό)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Έλεγχος συμβόλων TradingView
        run: |
          mkdir out
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          codes=[l.strip() for l in open('tv_codes.txt') if l.strip()]
          res={}
          for c in codes:
              url='https://symbol-search.tradingview.com/symbol_search/v3/?text='+urllib.parse.quote(c)+'&exchange=ATHEX&hl=0&lang=en&domain=production'
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Origin':'https://www.tradingview.com','Referer':'https://www.tradingview.com/'})
              try:
                  j=json.loads(urllib.request.urlopen(req, timeout=20).read().decode())
                  syms=j.get('symbols', j if isinstance(j,list) else [])
                  res[c]=[(s.get('symbol'),s.get('exchange'),s.get('description'),s.get('type')) for s in syms[:5]]
              except Exception as e:
                  res[c]='ERR '+str(e)
              time.sleep(0.3)
          json.dump(res, open('out/tv.json','w'), ensure_ascii=False, indent=1)
          print(sum(1 for v in res.values() if isinstance(v,list) and v), 'of', len(codes), 'have results')
          PY
      - name: Αποθήκευση
        run: |
          cd out && git init -q -b debug && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm debug && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" debug
