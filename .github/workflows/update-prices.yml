name: Ενημέρωση τιμών

# Πώς δουλεύει:
# Οι προγραμματισμένες εκτελέσεις του GitHub δεν είναι αξιόπιστες ανά 15 λεπτά
# (συχνά καθυστερούν ή παραλείπονται). Γι' αυτό μία εκτέλεση μένει ανοιχτή όσο
# διαρκεί η συνεδρίαση και ενημερώνει μόνη της τις τιμές κάθε 15 λεπτά.
# Οι ωριαίες εκκινήσεις παρακάτω απλώς τη «ξυπνούν» αν δεν τρέχει ήδη.

on:
  schedule:
    # Κάθε ώρα, Δευτέρα-Παρασκευή, 06:02-15:02 UTC (καλύπτει θερινή και χειμερινή ώρα)
    - cron: "2 6-15 * * 1-5"
  # Κουμπί «Run workflow» για χειροκίνητη εκτέλεση (τρέχει πάντα μία ενημέρωση)
  workflow_dispatch:

permissions:
  contents: write

# Μόνο μία εκτέλεση κάθε φορά. Αν τρέχει ήδη, η επόμενη περιμένει.
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Εγκατάσταση βιβλιοθηκών
        run: pip install requests beautifulsoup4

      - name: Ενημέρωση τιμών κάθε 15 λεπτά όσο είναι ανοιχτή η αγορά
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Σταματάμε πριν το όριο των 6 ωρών του GitHub· η επόμενη ωριαία
          # εκκίνηση συνεχίζει από εκεί.
          deadline=$(( $(date +%s) + 340 * 60 ))
          first=1
          last_ok=1

          in_session() {
            dow=$(TZ=Europe/Athens date +%u)
            hm=$(TZ=Europe/Athens date +%H%M)
            [ "$dow" -le 5 ] && [ "$((10#$hm))" -ge 930 ] && [ "$((10#$hm))" -le 1735 ]
          }

          while :; do
            if [ $first -eq 1 ] || in_session; then
              echo "=== $(TZ=Europe/Athens date '+%d/%m %H:%M') ώρα Ελλάδας ==="
              if python scripts/fetch_data.py; then
                last_ok=1
                git add data.json history.json intraday.json
                if git diff --cached --quiet; then
                  echo "Καμία αλλαγή."
                else
                  git commit -qm "Ενημέρωση τιμών $(date -u +'%Y-%m-%d %H:%M') UTC"
                  for i in 1 2 3; do
                    git pull -q --rebase origin main && git push -q && break
                    sleep 10
                  done
                fi
              else
                last_ok=0
                echo "Η ενημέρωση απέτυχε σε αυτόν τον γύρο· ξαναδοκιμάζω σε 15 λεπτά."
              fi
            fi
            first=0

            # Τέλος: εκτός συνεδρίασης ή κοντά στο όριο χρόνου
            in_session || break
            [ $(( $(date +%s) + 960 )) -lt $deadline ] || break

            # Αναμονή μέχρι το επόμενο τέταρτο (+1 λεπτό)
            sleep $(( 900 - $(date +%s) % 900 + 60 ))
          done

          # Κόκκινο ✗ στο Actions αν ο τελευταίος γύρος απέτυχε
          [ $last_ok -eq 1 ]

      - name: Αρχεία διάγνωσης (μόνο αν αποτύχει)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
